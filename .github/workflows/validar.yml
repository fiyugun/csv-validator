name: Validar CSV

on:
  push:
    paths:
      - 'data/*.csv'

jobs:
  validar:
    runs-on: ubuntu-latest

    steps:

      - name: Verificar instalación
        run: |
          pip list
          python --version
          which python

    
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'


      - name: Verificar pandas
        run: |
          python -c "import pandas; print('Pandas OK:', pandas.__version__)"
      
      - name: Ejecutar validación
        run: python scripts/validar_csv.py

      - name: Verificar instalación
        run: pip list

      - name: Ejecutar validación
        run: python scripts/validar_csv.py
